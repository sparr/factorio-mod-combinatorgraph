[recipe-name]
combinatorgraph-tool=Combinator Graph Tool
[item-name]
combinatorgraph-tool=Combinator Graph Tool
[item-description]
combinatorgraph-tool=Generates a GraphViz diagram of the selected circuit networks.

[mod-setting-name]
combinatorgraph-show-ineffective=Show settings with no effect
combinatorgraph-localise=Use the game's own names
combinatorgraph-icons=Show entity pictures

[mod-setting-description]
combinatorgraph-show-ineffective=Draw conditions, outputs and filters that have been left blank. A condition with no signal is always false and an output with no signal emits nothing, so by default neither is drawn at all.
combinatorgraph-localise=Print entity names, signal names and settings in your language instead of their internal English names. Off by default, because translated names are often much longer and the graph has no way to wrap or shorten them.
combinatorgraph-icons=Put each entity's icon beside its name. The graph refers to icon files by a path relative to Factorio's data directory, so render it with that directory given to graphviz: dot -Gimagepath=/path/to/Factorio/data ...

# The words the graph uses that the game has no equivalent for. Everything else it says
# borrows the game's own keys, so the graph reads the way the entity's own window does.
[combinatorgraph]
on=On
off=Off
avail-log=Avail Log
total-log=Total Log
avail-con=Avail Con
total-con=Total Con
red-signal=Red Signal
orange-signal=Orange Signal
green-signal=Green Signal
blue-signal=Blue Signal
set-stack-size=Set Stack Size
volume=Volume
global=Global
polyphony=Polyphony
alert=Alert
on-map=On Map
